name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools
      - name: Generate and verify fixtures
        run: bash script/build_fixtures.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fat-fixtures
          path: test/fixtures/generated/
          if-no-files-found: error

  test:
    needs: fixtures
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ['3.1', '3.3', '3.4', '4.0']
        exclude:
          - os: ubuntu-latest
            ruby: '3.1'
        include:
          - os: ubuntu-24.04
            ruby: '3.1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: fat-fixtures
          path: test/fixtures/generated/
      - name: Test
        run: bundle exec rake test
        env:
          REQUIRE_FIXTURES: '1'
      - name: Build gem
        run: gem build sandcrawler.gemspec
      - name: Check CLI entrypoint
        run: bundle exec ruby exe/sandcrawler --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rubocop
